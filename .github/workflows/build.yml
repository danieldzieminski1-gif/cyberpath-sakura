name: Build Android APK

# Builds a release APK on every push. Download it from:
#  - the "Releases" page of your repo (easiest on a phone, no zip), or
#  - Actions > the run > Artifacts.
on:
  push:
    paths-ignore: ['**.md']
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # lets the job publish the APK as a GitHub Release

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APK_NAME: CyberPath-build${{ github.run_number }}.apk
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Prepare Android project (adds INTERNET permission)
        run: bash tool/prepare_android.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (does not block the APK)
        continue-on-error: true
        run: flutter analyze --no-fatal-infos

      - name: Unit and widget tests (do not block the APK)
        continue-on-error: true
        run: flutter test

      - name: Build release APK
        run: |
          flutter build apk --release --no-tree-shake-icons \
            --build-number=${{ github.run_number }} \
            --dart-define=LESSONS_URL=https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/remote/lessons.json
          cp build/app/outputs/flutter-apk/app-release.apk "$APK_NAME"
          ls -lh "$APK_NAME"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyberPath-apk
          path: ${{ env.APK_NAME }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish as GitHub Release (phone-friendly download)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" "$APK_NAME" \
            --target "${{ github.sha }}" \
            --title "CyberPath build ${{ github.run_number }}" \
            --notes "Automatic build of ${{ github.sha }}. Open this page on your Android phone and tap the .apk to install." \
            --prerelease
          echo "### APK ready 🌸" >> "$GITHUB_STEP_SUMMARY"
          echo "Download: https://github.com/${{ github.repository }}/releases/tag/build-${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"
